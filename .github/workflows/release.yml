name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  SOURCE_COMMIT: ${{ github.sha }}

jobs:
  plan:
    if: >-
      github.repository == 'openai/auth-javascript' &&
      vars.RELEASE_AUTOMATION_ENABLED == 'true' &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.head_sha == github.sha)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Require successful main CI for this exact commit
        run: node scripts/release.ts check-ci
        env:
          GH_TOKEN: ${{ github.token }}
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2, Changesets 3
        id: mode

  version:
    needs: plan
    if: needs.plan.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Create a token for this repository only
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.OPENAI_SDKS_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPENAI_SDKS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Create or update the version PR
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2, Changesets 3
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: pnpm version:packages:ci
          commit-message: 'chore: version SDK packages'
          pr-title: 'chore: version SDK packages'
          pr-base-branch: main
          pr-draft: create

  pack:
    needs: plan
    if: >-
      needs.plan.outputs.mode == 'publish' &&
      vars.NPM_PUBLISH_ENABLED == 'true' &&
      github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Require completed first publications and unpublished target versions
        run: node scripts/release.ts check-publish-plan
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm playground:build
      - run: pnpm check:distribution
      - name: Pack and inspect the exact release archives
        run: node scripts/release.ts pack artifacts/release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: pack
    if: >-
      vars.NPM_PUBLISH_ENABLED == 'true' &&
      github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      # No dependency installation or package build belongs in this job.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.pack.outputs.artifact-id }}
          merge-multiple: true
          path: artifacts/release
          digest-mismatch: error
      - name: Publish retained archives through npm OIDC and verify both packages
        run: node scripts/release.ts publish artifacts/release
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}

  consumer:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check exact registry versions in a fresh consumer
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          react_version=$(node -p "require('./package.json').devDependencies.react")
          consumer=$(mktemp -d "${RUNNER_TEMP}/auth-consumer.XXXXXX")
          printf '{"private":true,"type":"module"}\n' > "${consumer}/package.json"
          npm install --prefix "${consumer}" --ignore-scripts --no-audit --no-fund \
            --registry https://registry.npmjs.org/ --cache "${RUNNER_TEMP}/registry-cache" \
            "@openai/auth@${version}" "@openai/auth-react@${version}" \
            "react@${react_version}" "react-dom@${react_version}"
          cp scripts/package-fixtures/styles.mjs "${consumer}/styles.mjs"
          cd "${consumer}"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createRequire } from 'node:module';
          const require = createRequire(import.meta.url);
          for (const name of ['@openai/auth', '@openai/auth/client', '@openai/auth-react']) {
            assert(import.meta.resolve(name).endsWith('.mjs'));
            await import(name);
            assert(require.resolve(name).endsWith('.cjs'));
            require(name);
          }
          const { createChatGPTAuth } = await import('@openai/auth/client');
          const client = createChatGPTAuth({ authPath: '/auth/chatgpt' });
          assert.equal(client.getSnapshot().state.status, 'idle');
          await client.destroy();
          NODE
          node styles.mjs

  record:
    needs: [pack, consumer]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.pack.outputs.artifact-id }}
          merge-multiple: true
          path: artifacts/release
          digest-mismatch: error
      - run: node scripts/release.ts verify artifacts/release
      - name: Create a token for release records in this repository
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.OPENAI_SDKS_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPENAI_SDKS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Record immutable package tags, notes, and archive hashes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v8
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const assert = require('node:assert/strict');
            const { readFileSync } = require('node:fs');
            const { createHash } = require('node:crypto');
            const directory = 'artifacts/release';
            const manifest = JSON.parse(readFileSync(`${directory}/release.json`, 'utf8'));
            assert.equal(manifest.sourceCommit, process.env.SOURCE_COMMIT);
            for (const [index, pkg] of manifest.packages.entries()) {
              const tag = `${pkg.name}@${pkg.version}`;
              try {
                let object = (await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` })).data.object;
                for (let depth = 0; object.type === 'tag' && depth < 8; depth++) {
                  object = (await github.rest.git.getTag({ ...context.repo, tag_sha: object.sha })).data.object;
                }
                assert.equal(object.type, 'commit');
                assert.equal(object.sha, manifest.sourceCommit, `Existing tag ${tag} points to another commit.`);
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.git.createRef({ ...context.repo, ref: `refs/tags/${tag}`, sha: manifest.sourceCommit });
              }
              let release;
              try {
                release = (await github.rest.repos.getReleaseByTag({ ...context.repo, tag })).data;
              } catch (error) {
                if (error.status !== 404) throw error;
                const packageDirectory = index === 0 ? 'core' : 'react';
                const changelog = `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/${manifest.sourceCommit}/packages/${packageDirectory}/CHANGELOG.md`;
                release = (await github.rest.repos.createRelease({
                  ...context.repo, tag_name: tag, target_commitish: manifest.sourceCommit,
                  name: tag, draft: false, prerelease: false,
                  body: `Source commit: ${manifest.sourceCommit}\n\n[Package changelog](${changelog})\n\nThe attached release.json records the version and SHA-256/SHA-512 integrity of both SDK archives.`,
                })).data;
              }
              for (const name of [pkg.filename, 'release.json']) {
                const bytes = readFileSync(`${directory}/${name}`);
                const digest = `sha256:${createHash('sha256').update(bytes).digest('hex')}`;
                const existing = release.assets.find((asset) => asset.name === name);
                if (existing) {
                  assert.equal(existing.digest, digest, `Existing release asset ${name} has different bytes.`);
                } else {
                  await github.rest.repos.uploadReleaseAsset({
                    ...context.repo, release_id: release.id, name, data: bytes,
                    headers: { 'content-type': 'application/octet-stream', 'content-length': bytes.length },
                  });
                }
              }
            }
