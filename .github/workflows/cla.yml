name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: cla-signatures
  cancel-in-progress: false

permissions: {}

jobs:
  cla:
    if: >-
      github.repository == 'openai/auth-javascript' &&
      (
        (github.event_name == 'pull_request_target' &&
          (github.event.action != 'closed' || github.event.pull_request.merged == true)) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # Rerun the original CLA check after the contributor signs.
      contents: write # Update only this repository's signature records.
      pull-requests: write # Request consent and preserve merged PR discussions.
    steps:
      # Never check out or execute pull-request code in this privileged workflow.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          path-to-document: https://github.com/openai/auth-javascript/blob/1bfe84032a308369234761aaf767a1cb32a307fc/CLA.md
          path-to-signatures: signatures/cla-v1.json
          branch: cla-signatures
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          allowlist: dependabot[bot],github-actions[bot],openai-sdks[bot]
          lock-pullrequest-aftermerge: 'true'
